# valkey.conf — Production configuration for each backend Valkey instance
# Deploy to /etc/valkey/valkey.conf (or pass to valkey-server explicitly)
# Usage: valkey-server /path/to/valkey.conf
#
# Each of Sys2/Sys3/Sys4 runs its own Valkey with this config.
# Bind to all interfaces so the other backends can fan-out writes to it.

# ── Network ───────────────────────────────────────────────────────────────────
bind 0.0.0.0
protected-mode no
port 6379

# ── Persistence (REQUIREMENT: must use persistent storage) ────────────────────
#
# Two mechanisms enabled — belt-and-suspenders:
#
# 1. AOF (Append-Only File): every write command is logged to disk before ack.
#    This gives durability down to the last command before a crash.
#    appendfsync everysec: flush to disk every second — good balance of
#    durability vs I/O overhead. Use "always" for maximum safety at the cost
#    of IOPS.
appendonly yes
appendfilename "valkey-chat.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 2. RDB Snapshots: periodic full snapshot to disk as a recovery baseline.
#    If AOF is corrupted, Valkey falls back to the most recent RDB.
#    save <seconds> <changes>: snapshot if N changes in M seconds.
save 300 1
save 60 1000
save 10 10000
dbfilename valkey-chat.rdb
dir /var/lib/valkey

# ── Memory ────────────────────────────────────────────────────────────────────
# Limit memory so Valkey doesn't eat all RAM on the backend machine.
# Adjust based on your system (8GB machines → 2GB is safe).
maxmemory 2gb
# allkeys-lru: evict least-recently-used keys when maxmemory is hit.
# For chat history, we prefer keeping recent messages; old ones can be evicted.
maxmemory-policy allkeys-lru

# ── Connection & Timeout ──────────────────────────────────────────────────────
tcp-backlog 511
timeout 0
tcp-keepalive 300
maxclients 1000

# ── Logging ───────────────────────────────────────────────────────────────────
loglevel notice
logfile /var/log/valkey/valkey.log

# ── Daemonise ─────────────────────────────────────────────────────────────────
daemonize yes
pidfile /var/run/valkey/valkey.pid
