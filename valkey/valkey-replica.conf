# ─── valkey-replica.conf ─────────────────────────────────────────────────────
# Valkey replica configuration for Sys1 and Sys3.
# Each replica replicates ALL data from the primary (Sys2).
# The backend's read client (VALKEY_REPLICA_URL) points to 127.0.0.1:6274
# on each system — reads never leave the local machine.
#
# Deploy:
#   # On Sys1:
#   sudo cp valkey-replica.conf /etc/valkey/valkey.conf
#   # Edit: set REPLICA_MASTER_HOST to 10.x.x.2 (Sys2 IP)
#   sudo systemctl restart valkey
#
#   # On Sys3: same steps
#
# Verify replication is working:
#   valkey-cli -p 6274 info replication
#   # role: slave
#   # master_link_status: up
#   # master_last_io_seconds_ago: 0 (or 1)

# ─── Network ─────────────────────────────────────────────────────────────────
bind 0.0.0.0
port 6274
protected-mode no
tcp-keepalive 300

# ─── Replication ──────────────────────────────────────────────────────────────
# Point to the primary on Sys2. Replace 10.x.x.2 with the actual Sys2 IP.
replicaof 10.x.x.2 6274

# Replicas are read-only — no writes accepted locally.
# The write client (_rw) always goes to the primary.
replica-read-only yes

# How long to buffer replication data when a replica reconnects.
repl-backlog-size 1mb
repl-backlog-ttl 3600

# ─── Persistence on Replica (safety net) ─────────────────────────────────────
# Even replicas persist — if the primary crashes and you promote a replica,
# it will have its own consistent snapshot.
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

save 900 1
save 300 10
save 60 10000

rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /var/lib/valkey/

# ─── Logging ──────────────────────────────────────────────────────────────────
loglevel notice
logfile /var/log/valkey/valkey-replica.log
