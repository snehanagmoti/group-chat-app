# ─── valkey-replica-sys3.conf ────────────────────────────────────────────────
# Valkey replica configuration for Sys3.
# Sys3's port convention: 6275
# Replicates all data from the Sys2 primary (port 6274).
# FastAPI on Sys3 reads from 127.0.0.1:6275 (VALKEY_REPLICA_URL).
#
# Deploy on Sys3:
#   sudo cp valkey/valkey-replica-sys3.conf /etc/valkey/valkey.conf
#   # Edit the replicaof line — replace <SYS2_IP> with actual Sys2 IP
#   sudo systemctl restart valkey
#
# Verify:
#   valkey-cli -p 6275 ping                  # → PONG
#   valkey-cli -p 6275 info replication
#   # role:slave   master_link_status:up

# ─── Network ─────────────────────────────────────────────────────────────────
bind 0.0.0.0
port 6275                    # Sys3's Valkey port (follows x275 convention)
protected-mode no
tcp-keepalive 300

# ─── Replication ──────────────────────────────────────────────────────────────
# Connects to the primary (Sys2) on port 6274.
# REPLACE <SYS2_IP> with the actual Sys2 IP address before deploying.
replicaof <SYS2_IP> 6274

replica-read-only yes
repl-backlog-size 1mb
repl-backlog-ttl 3600

# ─── Persistence on Replica (safety net) ─────────────────────────────────────
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

save 900 1
save 300 10
save 60 10000

rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /var/lib/valkey/

# ─── Logging ──────────────────────────────────────────────────────────────────
loglevel notice
logfile /var/log/valkey/valkey-replica.log
