daemonize yes

# ─── valkey-primary.conf ─────────────────────────────────────────────────────
# Valkey primary configuration for Sys2.
# All write clients (VALKEY_PRIMARY_URL) from all 3 backends point here.
# Sys3 (port 6275) and Sys4 (port 6276) replicate from this node.


# ─── Network ─────────────────────────────────────────────────────────────────
bind 0.0.0.0
port 6000
protected-mode no
tcp-backlog 1024
timeout 0
tcp-keepalive 60

# ─── Persistence: Append-Only File ─────────────────────────────────────────
# AOF completely disabled for the load test.
# With appendonly yes, Valkey forks itself for AOF rewrites. Under sustained
# write load, the copy-on-write overhead can spike Valkey's RSS to 2× its
# normal size for 5-10 seconds — on a 512MB machine that triggers the Linux
# OOM killer and takes the whole backend down.
# Data recovery is not required for the assignment; disabling AOF removes the
# only source of uncontrolled memory spikes.
appendonly no

# ─── Persistence: RDB snapshot (backup layer) ─────────────────────────────────
# RDB saves are disabled for the load test: a BGSAVE fork mid-test causes
# a copy-on-write memory spike + disk I/O that spikes latency for 2-10 seconds.
# The AOF (above) handles durability; RDB is only a convenience backup.
# Re-enable after the assignment if you want point-in-time snapshots.
save ""

rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# ─── Data directory ───────────────────────────────────────────────────────────
# All AOF and RDB files are written here.
dir /var/lib/valkey/

# ─── Memory ───────────────────────────────────────────────────────────────────
# Hard cap: Valkey will return errors on writes above this limit rather than
# consuming unlimited RAM and getting OOM-killed by the OS.
# noeviction: never silently drop messages — return an error so the app can
# handle it, rather than losing data without warning.
# 150mb leaves ~280mb for 4 Python workers + OS on a 512mb machine.
maxmemory 150mb
maxmemory-policy noeviction

# ─── Performance ─────────────────────────────────────────────────────────────
# Disable slow-log for load tests (reduces per-command overhead).
slowlog-log-slower-than -1
# Increase hz for faster expiry and background task ticks under high load.
hz 20
dynamic-hz yes

# ─── Replication ──────────────────────────────────────────────────────────────
# Primary has no replicaof directive.
# Sys3 replica connects with: REPLICAOF <SYS2_IP> 6274  (Sys3 listens on 6275)
# Sys4 replica connects with: REPLICAOF <SYS2_IP> 6274  (Sys4 listens on 6276)

# ─── Logging ──────────────────────────────────────────────────────────────────
loglevel notice
logfile /var/log/valkey/valkey-primary.log
