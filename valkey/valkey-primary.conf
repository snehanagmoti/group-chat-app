# ─── valkey-primary.conf ─────────────────────────────────────────────────────
# Valkey primary configuration for Sys2.
# All write clients (VALKEY_PRIMARY_URL) from all 3 backends point here.
# Sys3 (port 6275) and Sys4 (port 6276) replicate from this node.
#
# Deploy:
#   sudo cp valkey-primary.conf /etc/valkey/valkey.conf
#   sudo systemctl restart valkey   # or: valkey-server /etc/valkey/valkey.conf
#
# Verify after start:
#   valkey-cli -p 6274 info replication
#   # role: master

# ─── Network ─────────────────────────────────────────────────────────────────
bind 0.0.0.0
port 6274
protected-mode no
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ─── Persistence: Append-Only File ───────────────────────────────────────────
# AOF gives the strongest durability: at most 1 second of data loss on crash.
appendonly yes
appendfilename "appendonly.aof"

# everysec: fsync once per second — good balance of safety vs. performance.
# Use "always" for zero data loss at the cost of throughput.
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ─── Persistence: RDB snapshot (backup layer) ─────────────────────────────────
# save <seconds> <changes>
# if at least 1 key changed in 900 seconds → snapshot
save 900 1
# if at least 10 keys changed in 300 seconds → snapshot
save 300 10
# if at least 10000 keys changed in 60 seconds → snapshot
save 60 10000

rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# ─── Data directory ───────────────────────────────────────────────────────────
# All AOF and RDB files are written here.
dir /var/lib/valkey/

# ─── Memory ───────────────────────────────────────────────────────────────────
# Set to 75% of Sys2 RAM.  Adjust as needed.
# maxmemory 2gb
# maxmemory-policy allkeys-lru

# ─── Replication ──────────────────────────────────────────────────────────────
# Primary has no replicaof directive.
# Sys3 replica connects with: REPLICAOF <SYS2_IP> 6274  (Sys3 listens on 6275)
# Sys4 replica connects with: REPLICAOF <SYS2_IP> 6274  (Sys4 listens on 6276)

# ─── Logging ──────────────────────────────────────────────────────────────────
loglevel notice
logfile /var/log/valkey/valkey-primary.log
