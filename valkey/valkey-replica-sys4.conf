daemonize yes

# ─── valkey-replica-sys4.conf ────────────────────────────────────────────────
# Valkey replica configuration for Sys4.
# Sys4's port convention: 6276
# Replicates all data from the Sys2 primary (port 6274).
# FastAPI on Sys4 reads from 127.0.0.1:6276 (VALKEY_REPLICA_URL).

# ─── Network ─────────────────────────────────────────────────────────────────
bind 0.0.0.0
port 6000
protected-mode no
tcp-keepalive 60
tcp-backlog 1024

# ─── Replication ──────────────────────────────────────────────────────────────
# Connects to the primary (Sys2) on port 6274.
# REPLACE <SYS2_IP> with the actual Sys2 IP address before deploying.
replicaof 10.1.75.51 6274

replica-read-only yes
# Increase backlog for fast full-resyncs after network blips.
repl-backlog-size 8mb
repl-backlog-ttl 3600
# Disable timeout so a slow primary sync doesn't break the replica.
repl-timeout 60

# ─── Persistence on Replica ──────────────────────────────────────────────────
# AOF and RDB are disabled on replicas. The primary is the source of truth;
# enabling persistence here only wastes disk I/O on the read path,
# competing with application reads and slowing /feed responses.
# If the replica crashes it will simply re-sync from the primary.
appendonly no
save ""

dir /var/lib/valkey/

# ─── Memory ─────────────────────────────────────────────────────────────
# Replica holds a copy of all data; cap it so Python workers + OS can share
# the remaining RAM safely. 100mb is more than enough for test message data.
maxmemory 100mb
maxmemory-policy noeviction

# ─── Performance ─────────────────────────────────────────────────────────────
slowlog-log-slower-than -1
hz 20
dynamic-hz yes

# ─── Logging ──────────────────────────────────────────────────────────────────
loglevel notice
logfile /var/log/valkey/valkey-replica.log
